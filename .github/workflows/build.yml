name: Windows build and checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build .NET Framework application
        shell: powershell
        run: ./build.ps1
      - name: Run simulated checks
        shell: powershell
        run: ./run-tests.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CorsairMemoryTakeover-windows-x64-ci
          path: dist/CorsairTakeover.exe
          if-no-files-found: error
